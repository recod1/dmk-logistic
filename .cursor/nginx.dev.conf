# Dev-only nginx config for the Cloud Agent environment.
# Mirrors the production web image: serves the built PWA (web/dist) and
# proxies /api/* to the FastAPI backend (:8000) on the same origin,
# listening on http://localhost:8080.
worker_processes 1;
daemon off;
pid /workspace/.cursor/run/nginx.pid;
error_log /workspace/.cursor/run/nginx.error.log info;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /workspace/.cursor/run/nginx.access.log;
    client_body_temp_path /workspace/.cursor/run/nginx-client-body;
    proxy_temp_path /workspace/.cursor/run/nginx-proxy;
    fastcgi_temp_path /workspace/.cursor/run/nginx-fastcgi;
    uwsgi_temp_path /workspace/.cursor/run/nginx-uwsgi;
    scgi_temp_path /workspace/.cursor/run/nginx-scgi;

    server {
        listen 8080;
        server_name _;

        root /workspace/web/dist;
        index index.html;
        charset utf-8;

        # Backend API (mirrors production: strip /api prefix before proxying).
        location /api/ {
            client_max_body_size 256m;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
            rewrite ^/api/?(.*)$ /$1 break;
            proxy_pass http://127.0.0.1:8000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location = /manifest.webmanifest {
            default_type application/manifest+json;
            try_files $uri =404;
            add_header Cache-Control "public, max-age=3600";
            add_header Content-Disposition "inline";
        }

        location = /sw.js {
            default_type application/javascript;
            try_files $uri =404;
            add_header Cache-Control "no-cache";
            add_header Content-Disposition "inline";
        }

        # SPA fallback.
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
