# Dev-only nginx config for Cloud Agent environment.
# Serves the PWA (Vite dev server on :5173) and proxies /api/* to the
# FastAPI backend (:8000) on the same origin at http://localhost:8080.
worker_processes 1;
daemon off;
pid /workspace/.cursor/run/nginx.pid;
error_log /workspace/.cursor/run/nginx.error.log info;

events {
    worker_connections 1024;
}

http {
    access_log /workspace/.cursor/run/nginx.access.log;
    client_body_temp_path /workspace/.cursor/run/nginx-client-body;
    proxy_temp_path /workspace/.cursor/run/nginx-proxy;
    fastcgi_temp_path /workspace/.cursor/run/nginx-fastcgi;
    uwsgi_temp_path /workspace/.cursor/run/nginx-uwsgi;
    scgi_temp_path /workspace/.cursor/run/nginx-scgi;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 8080;
        server_name _;

        # Backend API (mirrors production: strip /api prefix before proxying).
        location /api/ {
            client_max_body_size 256m;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
            rewrite ^/api/?(.*)$ /$1 break;
            proxy_pass http://127.0.0.1:8000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # PWA served by the Vite dev server (with HMR websocket support).
        location / {
            proxy_pass http://127.0.0.1:5173;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }
    }
}
