map $request_uri $dmk_api_path {
    ~^/api(/[^?]*) $1;
    default /;
}

# Connection: upgrade only for actual WebSocket handshakes.
# Sending it on every /api request hangs some mobile carriers until the client aborts.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      "";
}

server {
    listen 80;
    server_name _;
    merge_slashes off;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    location /api/ {
        client_max_body_size 256m;
        proxy_connect_timeout 15s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        # Keep %2F in route ids from $request_uri, but do not fold ?query into the path.
        resolver 127.0.0.11 valid=10s ipv6=off;
        proxy_pass http://api:8000$dmk_api_path$is_args$args;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    location = /manifest.webmanifest {
        default_type application/manifest+json;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=3600";
        add_header Content-Disposition "inline";
    }

    location = /sw.js {
        default_type application/javascript;
        try_files $uri =404;
        add_header Cache-Control "no-cache";
        add_header Content-Disposition "inline";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
