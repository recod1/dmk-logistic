name: Docker publish (api + web + bot)

on:
  push:
    branches:
      - main
    tags:
      - "*"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  docker-publish:
    name: Build ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: api
            image: recod0/dmk-logistic-api
            dockerfile: api/Dockerfile
            cache: none
          - service: web
            image: recod0/dmk-logistic-web
            dockerfile: web/Dockerfile
            cache: gha
          - service: bot
            image: recod0/dmk-logistic-bot
            dockerfile: bot/Dockerfile
            cache: gha

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve image tags
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          short_sha="${GITHUB_SHA::7}"
          echo "short_sha=${short_sha}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push (no cache)
        if: matrix.cache == 'none'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ matrix.image }}:latest
            ${{ matrix.image }}:sha-${{ steps.meta.outputs.short_sha }}
          no-cache: true
          build-args: |
            CACHE_BUST=${{ github.sha }}
            REQUIREMENTS_HASH=${{ hashFiles('api/requirements.txt') }}

      - name: Build and push (gha cache)
        if: matrix.cache == 'gha'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ matrix.image }}:latest
            ${{ matrix.image }}:sha-${{ steps.meta.outputs.short_sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
          build-args: |
            CACHE_BUST=${{ github.sha }}
            REQUIREMENTS_HASH=${{ hashFiles('api/requirements.txt') }}

      - name: Write job summary
        if: always()
        shell: bash
        run: |
          {
            echo "### ${{ matrix.service }}"
            echo "- image: \`${{ matrix.image }}:latest\`"
            echo "- tag: \`${{ matrix.image }}:sha-${{ steps.meta.outputs.short_sha }}\`"
            echo "- dockerfile: \`${{ matrix.dockerfile }}\`"
            echo "- result: **${{ job.status }}**"
          } >> "$GITHUB_STEP_SUMMARY"

  docker-result:
    name: Build result
    needs: docker-publish
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Publish overall result
        shell: bash
        run: |
          set -euo pipefail
          result="${{ needs.docker-publish.result }}"
          sha="${GITHUB_SHA::7}"
          {
            echo "## Docker publish result"
            echo
            echo "- status: **${result}**"
            echo "- commit: \`${GITHUB_SHA}\`"
            echo "- images:"
            echo "  - \`recod0/dmk-logistic-api:latest\` / \`:sha-${sha}\`"
            echo "  - \`recod0/dmk-logistic-web:latest\` / \`:sha-${sha}\`"
            echo "  - \`recod0/dmk-logistic-bot:latest\` / \`:sha-${sha}\`"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$result" != "success" ]; then
            echo "Docker publish failed: ${result}" >&2
            exit 1
          fi
          echo "All Docker images published."
